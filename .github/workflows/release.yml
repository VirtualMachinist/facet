name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  build-cli:
    name: Build CLI (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            exe: ""
            archive: tar.gz
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
            archive: zip
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build probe CLI
        run: cargo build --release -p probe-cli --bin probe --target ${{ matrix.target }}
      - name: Set package metadata
        id: metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset_name="probe-cli-${version}-${{ matrix.platform }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"
      - name: Prepare package directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/probe${{ matrix.exe }}" dist/package/
          cp README.md dist/package/
      - name: Verify CLI starts
        shell: bash
        run: '"dist/package/probe${{ matrix.exe }}" --help'
      - name: Create tarball
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/${{ steps.metadata.outputs.asset_name }}.tar.gz" -C dist/package .
      - name: Create zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/package/*" `
            -DestinationPath "dist/${{ steps.metadata.outputs.asset_name }}.zip" `
            -Force
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist/${{ steps.metadata.outputs.asset_name }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Probe $GITHUB_REF_NAME" \
              --notes "CLI release for Probe $GITHUB_REF_NAME." \
              dist/*
          fi
