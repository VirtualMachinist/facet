# TypeSafe Jev (Facet native). Vault SoT: foundry/facet/collections/typesafe.
# Hydrate typesafeApiKey via `facet env set --secret` from $TYPESAFE_API_KEY.
# Never bake a key here or in Lattice bodies. jevShadow=true is classify-only.
opencollection: 1.0.0
info:
  name: TypeSafe Jev (Facet native)
  summary: Jev System One via Facet. Choice+Noul recipes. Secret typesafeApiKey from Facet env — never YAML/Lattice.
  version: 0.2.0
bundled: true
config:
  environments:
    - name: typesafe
      variables:
        - name: typesafeApi
          value: https://api.typesafe.ai
        - secret: true
          name: typesafeApiKey
          type: string
        - name: jevModel
          value: jev-latest
        - name: state
          value: "facet-jev smoke: is TypeSafe reachable from Facet?"
        - name: jevShadow
          value: "true"
items:
  - info:
      name: System One
      type: folder
      seq: 1
    items:
      - info:
          name: Smoke noul
          type: http
          seq: 1
        http:
          method: POST
          url: "{{typesafeApi}}/v1/systemone"
          headers:
            - name: Authorization
              value: "Bearer {{typesafeApiKey}}"
            - name: Content-Type
              value: application/json
            - name: Accept
              value: application/json
          body:
            type: json
            data: |-
              {
                "state": "{{state}}",
                "model": "{{jevModel}}",
                "questions": {
                  "reachable": {
                    "type": "noul",
                    "instructions": "Is this a connectivity or smoke check rather than a real user task?",
                    "criteria": {
                      "true": "Explicit smoke, ping, or reachability check",
                      "false": "A real user or agent task"
                    }
                  }
                }
              }
        settings:
          timeout: 30000
          followRedirects: true
          maxRedirects: 0
      - info:
          name: Tool gate
          type: http
          seq: 2
        http:
          method: POST
          url: "{{typesafeApi}}/v1/systemone"
          headers:
            - name: Authorization
              value: "Bearer {{typesafeApiKey}}"
            - name: Content-Type
              value: application/json
            - name: Accept
              value: application/json
          body:
            type: json
            data: |-
              {
                "state": "{{state}}",
                "model": "{{jevModel}}",
                "questions": {
                  "allow": {
                    "type": "choice",
                    "instructions": "Should the agent run this tool call?",
                    "criteria": {
                      "allow": "Safe, in-scope, reversible or already authorized",
                      "ask": "Ambiguous, destructive-adjacent, or needs a human",
                      "deny": "Out of scope, secret leak, or clearly unsafe"
                    }
                  }
                }
              }
        settings:
          timeout: 30000
          followRedirects: true
          maxRedirects: 0
      - info:
          name: Loop stop escalate
          type: http
          seq: 3
        http:
          method: POST
          url: "{{typesafeApi}}/v1/systemone"
          headers:
            - name: Authorization
              value: "Bearer {{typesafeApiKey}}"
            - name: Content-Type
              value: application/json
            - name: Accept
              value: application/json
          body:
            type: json
            data: |-
              {
                "state": "{{state}}",
                "model": "{{jevModel}}",
                "questions": {
                  "next": {
                    "type": "choice",
                    "instructions": "Given this agent step context, what should happen next?",
                    "criteria": {
                      "continue": "Progress is real; safe to take another step",
                      "stop": "Done, looping, or unsafe to continue",
                      "escalate": "Ambiguous or high-stakes — need a human"
                    }
                  }
                }
              }
        settings:
          timeout: 30000
          followRedirects: true
          maxRedirects: 0
      - info:
          name: Recipe vs adhoc
          type: http
          seq: 4
        http:
          method: POST
          url: "{{typesafeApi}}/v1/systemone"
          headers:
            - name: Authorization
              value: "Bearer {{typesafeApiKey}}"
            - name: Content-Type
              value: application/json
            - name: Accept
              value: application/json
          body:
            type: json
            data: |-
              {
                "state": "{{state}}",
                "model": "{{jevModel}}",
                "questions": {
                  "path": {
                    "type": "choice",
                    "instructions": "Should this request use a Facet OpenCollection recipe or an ad-hoc call?",
                    "criteria": {
                      "recipe": "Matches a known collection recipe; prefer Facet run",
                      "adhoc": "One-off; no stable recipe yet",
                      "hold": "Unclear — do not send yet"
                    }
                  }
                }
              }
        settings:
          timeout: 30000
          followRedirects: true
          maxRedirects: 0
