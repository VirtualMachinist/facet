[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/desktop",
    "crates/http",
    "crates/opencollection",
    "crates/postman",
    "crates/yaak",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
