[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/desktop",
    "crates/facet",
    "crates/facet-record",
    "crates/http",
    "crates/lattice",
    "crates/opencollection",
    "crates/postman",
    "crates/facet-tui",
    "crates/yaak",
]
# Facet builds: probe-desktop stays a member (upstream merges stay clean) but is
# excluded from the default set so `cargo build`/`cargo test` skip GPUI.
# Use `cargo build --workspace` to include it.
default-members = [
    "crates/cli",
    "crates/core",
    "crates/facet",
    "crates/facet-record",
    "crates/http",
    "crates/lattice",
    "crates/opencollection",
    "crates/postman",
    "crates/facet-tui",
    "crates/yaak",
]
resolver = "2"

[workspace.package]
version = "0.5.7"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
