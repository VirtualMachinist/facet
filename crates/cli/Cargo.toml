[package]
name = "probe-cli"
# Pinned: vendored Probe cut. Do NOT bump to match the Facet CLI version.
version = "0.5.9"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "probe"
path = "src/main.rs"

[[bench]]
name = "performance"
harness = false

[dependencies]
probe-core = { path = "../core" }
probe-http = { path = "../http" }
probe-opencollection = { path = "../opencollection" }
probe-postman = { path = "../postman" }
probe-yaak = { path = "../yaak" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "time", "signal"] }

[lints]
workspace = true

[dev-dependencies]
criterion = "0.7.0"
