[package]
name = "probe-http"
# Pinned: vendored Probe cut. Do NOT bump to match the Facet CLI version.
version = "0.5.9"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
probe-core = { path = "../core" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "multipart", "stream", "form", "query"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "fs", "net", "io-util", "sync"] }

[lints]
workspace = true


[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23.42", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = "0.26.5"
