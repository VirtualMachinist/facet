[package]
name = "probe-desktop"
description = "A fast, native, local-first API client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.bundle]
name = "Probe"
identifier = "dev.probe.desktop"
icon = [
    "crates/desktop/assets/app-icon/macos/Probe.icns",
    "crates/desktop/assets/app-icon/windows/Probe.ico",
    "crates/desktop/assets/app-icon/linux/hicolor/32x32/apps/dev.probe.desktop.png",
    "crates/desktop/assets/app-icon/linux/hicolor/128x128/apps/dev.probe.desktop.png",
    "crates/desktop/assets/app-icon/linux/hicolor/256x256/apps/dev.probe.desktop.png",
    "crates/desktop/assets/app-icon/linux/hicolor/512x512/apps/dev.probe.desktop.png",
]
category = "Developer Tool"
short_description = "A fast, native, local-first API client"
long_description = "Probe is a native API client for working with local OpenCollection workspaces."
linux_startup_wm_class = "dev.probe.desktop"

[dependencies]
atomic-write-file = "0.3.1"
directories = "6.0.0"
icondata = { version = "0.7.0", default-features = false, features = ["lucide"] }
# Longbridge gpui-base from longbridge/gpui-component. This is the unstyled
# `gpui-base` crate, not the styled `gpui-component` façade.
#
# Do not add `rev` to the GPUI git URL. gpui-base uses the same unpinned git
# source; a mismatched revision compiles two GPUIs and fails type check. Pin
# the Zed commit in Cargo.lock to the revision required by this gpui-base
# commit (see that revision's Cargo.lock `gpui` source).
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "d598c6c0a61c23650dd933d58d046c0708085531" }
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
probe-core = { path = "../core" }
probe-http = { path = "../http" }
probe-opencollection = { path = "../opencollection" }
probe-yaak = { path = "../yaak" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "fs", "net", "io-util"] }
notify = "8.2.0"

[dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed", features = ["font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed" }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.31"
