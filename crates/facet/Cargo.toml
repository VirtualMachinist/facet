[package]
name = "facet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Facet: Probe cut for the terminal, with Lattice underneath"

[[bin]]
name = "facet"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
facet-tui = { path = "../facet-tui" }
lattice = { path = "../lattice" }
probe-cli = { path = "../cli" }
probe-core = { path = "../core" }
probe-http = { path = "../http" }
probe-opencollection = { path = "../opencollection" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
